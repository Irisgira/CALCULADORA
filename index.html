<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora Kawaii</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calc">
    <h1><span id="face">&#128570;</span> CALCULADORA </h1>
    <div id="display">0</div>
    <div class="keys">
      <button data-k="C" class="fn wide">C</button>
      <button data-k="/" class="op">÷</button>
      <button data-k="7">7</button>
      <button data-k="8">8</button>
      <button data-k="9">9</button>
      <button data-k="*" class="op">×</button>
      <button data-k="4">4</button>
      <button data-k="5">5</button>
      <button data-k="6">6</button>
      <button data-k="-" class="op">−</button>
      <button data-k="1">1</button>
      <button data-k="2">2</button>
      <button data-k="3">3</button>
      <button data-k="+" class="op">+</button>
      <button data-k="0" class="two">0</button>
      <button data-k=".">.</button>
      <button data-k="=" class="eq">=</button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
